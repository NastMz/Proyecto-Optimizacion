[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-optimizacion"
version = "1.0.0"
description = "Programación lineal para la empresa Sazón Llano: simplex de dos fases paso a paso y análisis de sensibilidad."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Santiago Martinez" }, { name = "Joshep Mateo Granada" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "numpy==2.5.5",
    "matplotlib==3.11.2",
    "QtAwesome==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "scipy==1.18.1",
]

[project.gui-scripts]
sazon-llano = "optimizacion.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# QPrinter probes Windows COM printer interfaces; faulthandler would dump those handled
# first-chance exceptions as noise, so it is disabled.
addopts = "-q -p no:faulthandler"
